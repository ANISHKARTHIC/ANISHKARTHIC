for venue door staff: scan a UK</text><text xml:space="preserve" x="760" y="141" font-size="14.5" fill="#9198a1" class="s">driving licence with a phone and get PASS,</text><text xml:space="preserve" x="760" y="162" font-size="14.5" fill="#9198a1" class="s">CHECK or DENY from a single request.</text><text xml:space="preserve" x="760" y="197" font-size="10.5" fill="#6e7681" letter-spacing="1.5" class="m">WHAT I BUILT</text><text xml:space="preserve" x="760" y="219" font-size="12" fill="#e3b341" class="m">01</text><text xml:space="preserve" x="788" y="219" font-size="12" fill="#c9d1d9" class="m">AI service: quality, OCR, authenticity, risk</text><text xml:space="preserve" x="760" y="241" font-size="12" fill="#e3b341" class="m">02</text><text xml:space="preserve" x="788" y="241" font-size="12" fill="#c9d1d9" class="m">Licence parser that verifies the check digits</text><text xml:space="preserve" x="760" y="263" font-size="12" fill="#e3b341" class="m">03</text><text xml:space="preserve" x="788" y="263" font-size="12" fill="#c9d1d9" class="m">ArcFace face embeddings searched in pgvector</text><text xml:space="preserve" x="760" y="285" font-size="12" fill="#e3b341" class="m">04</text><text xml:space="preserve" x="788" y="285" font-size="12" fill="#c9d1d9" class="m">Backend, Flutter scanner, Next.js admin, AWS</text><line x1="760" y1="298" x2="1176" y2="298" stroke="#21262d"/><text xml:space="preserve" x="760" y="315" font-size="10.5" fill="#6e7681" letter-spacing="1" class="m">STACK</text><text xml:space="preserve" x="832" y="315" font-size="12" fill="#c9d1d9" class="m">FastAPI · EasyOCR · InsightFace</text><line x1="760" y1="324" x2="1176" y2="324" stroke="#21262d"/><text xml:space="preserve" x="760" y="341" font-size="10.5" fill="#6e7681" letter-spacing="1" class="m">DATA</text><text xml:space="preserve" x="832" y="341" font-size="12" fill="#c9d1d9" class="m">Postgres + pgvector · Redis · S3</text><line x1="760" y1="350" x2="1176" y2="350" stroke="#21262d"/><text xml:spa