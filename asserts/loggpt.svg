ory and loan records, with role-based access and a kiosk mode.</text><text xml:space="preserve" x="580" y="336" font-size="10" fill="#6e7681" text-anchor="end" class="m">FastAPI · MongoDB · Gemini / OpenAI · Next.js</text><rect x="20" y="56" width="560" height="196" rx="6" fill="#010409" stroke="#21262d"/><text xml:space="preserve" x="36" y="88" font-size="12" fill="#c9d1d9" class="a1 m"><tspan fill="#6e7681">you  </tspan><tspan fill="#e6edf3">Is an ESP32 free for tomorrow's lab?</tspan></text><text xml:space="preserve" x="36" y="118" font-size="12" fill="#c9d1d9" class="a2 m"><tspan fill="#6e7681">ctx  </tspan><tspan fill="#484f58">+ inventory   + open loans   + due dates</tspan></text><text xml:space="preserve" x="36" y="148" font-size="12" fill="#c9d1d9" class="a3 m"><tspan fill="#6e7681">llm  </tspan><tspan fill="#e3b341">gemini</tspan><tspan fill="#484f58">  → openai → rules</tspan></text><text xml:space="preserve" x="36" y="178" font-size="12" fill="#c9d1d9" class="a4 m"><tspan fill="#6e7681">bot  </tspan><tspan fill="#c9d1d9">Yes. ESP32 boards are in stock; two loans</tspan></text><text xml:space="preserve" x="36" y="208" font-size="12" fill="#c9d1d9" class="a5 m"><tspan fill="#6e7681">     </tspan><tspan fill="#c9d1d9">are due back today.</tspan></text><rect x="36" y="226" width="7" height="13" fill="#e3b341" class="a6"/></svg>